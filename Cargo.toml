[workspace]
members = [
    "crates/url-vault-core",
    "crates/url-vault-cli",
    "crates/url-vault-mcp",
    "crates/url-vault-ffi",
    "crates/url-vault-viewer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.4", features = ["derive"] }
fs2 = "0.4.3"
html-escape = "0.2.14"
html5ever = "0.39.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tiny_http = "0.12.0"
ureq = "2.12.1"
url = "2.5.8"

[workspace.lints.clippy]
pedantic = "warn"
