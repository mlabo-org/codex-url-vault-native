<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex URL Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="vault-popup">
    <header class="brand">
      <img src="icons/icon-48.png" alt="">
      <div>
        <p class="eyebrow">URL CAPTURE</p>
        <h1>Codex URL Vault</h1>
      </div>
      <span id="connectionBadge" class="connection-badge" aria-label="Native Host status"></span>
    </header>

    <section class="page-card" aria-labelledby="pageTitle">
      <p class="section-label">現在のページ</p>
      <h2 id="pageTitle">ページを読み込み中…</h2>
      <p id="pageUrl" class="page-url"></p>
    </section>

    <form id="saveForm">
      <label>
        <span>カテゴリ</span>
        <input id="categoryInput" type="text" list="categoryOptions" placeholder="例: Research/AI" autocomplete="off">
        <datalist id="categoryOptions"></datalist>
      </label>

      <label>
        <span>タグ</span>
        <input id="tagsInput" type="text" placeholder="reference, later">
      </label>

      <label>
        <span>メモ</span>
        <textarea id="noteInput" rows="3" placeholder="このURLを保存する理由"></textarea>
      </label>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <button id="saveButton" class="save-button" type="submit">
        <span>Vaultに保存</span>
        <kbd>⌘↵</kbd>
      </button>
    </form>

    <footer>
      <span>同じRust Core・同じSQLiteへ保存</span>
      <span id="extensionIdHint">Chrome</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
